name: Skyline Reusable Quality Workflow

# Controls when the workflow will run
on:
  # Validate pull requests and pushes to master; release on version tags
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-**"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  CI:
    # The reusable workflow declares write-all (OIDC, checkout, git push); a caller cap below that breaks it.
    permissions: write-all
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/DataMiner App Packages Master Workflow.yml@main
    with:
      configuration: Release
      sonarCloudProjectName: ${{ vars.SONAR_NAME }} # Go to 'https://sonarcloud.io/projects/create' and create a project. Then create a SONAR_NAME variable with the ID of the project as mentioned in the SonarCloud project URL.
      # solutionFilterName: "MySolutionFilter.slnf"
    secrets:
      dataminerToken: ${{ secrets.DATAMINER_TOKEN }} # The API key: generated in the DCP Admin app (https://admin.dataminer.services/) as authentication for a certain DataMiner System.

  deploy-daas:
    name: Deploy release to DaaS
    needs: CI
    # Only released versions exist in the Catalog; the version string is the tag that the CI job published.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/deploy-internal.yml
    with:
      mode: catalog
      catalog-version: ${{ github.ref_name }}
    secrets:
      DATAMINER_TOKEN: ${{ secrets.DATAMINER_TOKEN }}

  k6-api:
    name: k6 (API smoke on DaaS)
    needs: deploy-daas
    uses: ./.github/workflows/k6-tests.yml
    secrets: inherit
